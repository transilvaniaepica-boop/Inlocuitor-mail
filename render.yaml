services:
  - type: web
    name: inlocuitor-mail
    env: node
    plan: free
    region: frankfurt
    buildCommand: npm install --build-from-source && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
